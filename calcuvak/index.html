<style>
/* Layout: una sola carcasa azul marino con dos pestañas (Estándar, Financiera); teclas y acentos naranja Govak. */
:root {
  --bg: #e8ecf4;
  --shell: #14306b;
  --shell-edge: #0e2352;
  --screen: #0c1d44;
  --screen-fg: #ffffff;
  --screen-sub: #9fb1d6;
  --key: #f4f6fb;
  --key-fg: #0e1f45;
  --key-fn: #2b4a8f;
  --key-fn-fg: #ffffff;
  --key-mem: transparent;
  --key-mem-fg: #b9c7e6;
  --op: #f47b20;
  --op-fg: #0e1f45;
  --op-active: #ffa04d;
  --brand-fg: #14306b;
  --muted: #55648a;
  --panel: #0c1d44;
  --panel-line: #24427f;
  --focus: #ffa04d;
  --link: #14306b;
  --font-ui: "Archivo", system-ui, "Segoe UI", Arial, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070f22;
    --shell: #12285a;
    --shell-edge: #0b1a3c;
    --screen: #070f22;
    --screen-sub: #8fa3cf;
    --key: #1c3470;
    --key-fg: #f1f4fb;
    --key-fn: #2f4f98;
    --brand-fg: #e8eefc;
    --muted: #8fa3cf;
    --panel: #070f22;
    --link: #ffa04d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070f22;
  --shell: #12285a;
  --shell-edge: #0b1a3c;
  --screen: #070f22;
  --screen-sub: #8fa3cf;
  --key: #1c3470;
  --key-fg: #f1f4fb;
  --key-fn: #2f4f98;
  --brand-fg: #e8eefc;
  --muted: #8fa3cf;
  --panel: #070f22;
  --link: #ffa04d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--key-fg);
  font-family: var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.bar {
  width: 100%; max-width: 380px; background: var(--screen); border-radius: 12px; padding: 10px 14px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px;
}
.bar div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.bar b { font: 700 .62rem var(--font-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--screen-sub); }
.bar span { font: 500 .98rem var(--font-num); color: var(--screen-fg); font-variant-numeric: tabular-nums; }
.bar small { grid-column: 1 / -1; font-size: .7rem; color: var(--screen-sub); }
.brand { width: 100%; max-width: 380px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.wordmark { margin: 0; font-size: 1.55rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--brand-fg); line-height: 1; }
.wordmark b { color: var(--op); font-weight: 800; }
.byline { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); text-align: right; }

.calc {
  width: 100%; max-width: 380px;
  background: var(--shell);
  border-radius: 22px;
  padding: 14px;
  box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 18px 40px -18px rgba(8, 20, 55, .55), 0 0 0 1px var(--shell-edge);
  position: relative;
  display: flex; flex-direction: column; gap: 12px;
}
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--screen); padding: 4px; border-radius: 12px; }
.tab {
  appearance: none; border: 0; background: transparent; color: var(--screen-sub);
  font: 700 .72rem var(--font-ui); letter-spacing: .04em; text-transform: uppercase;
  padding: 10px 4px; border-radius: 9px; cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--op); color: var(--op-fg); }
.view { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

.screen {
  background: var(--screen);
  border-radius: 14px;
  padding: 12px 16px 14px;
  min-height: 128px;
  display: flex; flex-direction: column; justify-content: space-between;
  gap: 4px;
  min-width: 0;
}
.screen-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }
.tools { display: flex; gap: 6px; align-items: center; }
.mem-flag { font: 600 0.72rem var(--font-num); color: var(--op); letter-spacing: .06em; min-width: 1.6em; }
.tool {
  appearance: none; border: 1px solid var(--panel-line); background: transparent; color: var(--screen-sub);
  font: 600 0.72rem var(--font-ui); letter-spacing: .06em; text-transform: uppercase;
  padding: 5px 10px; border-radius: 999px; cursor: pointer;
}
.tool:hover { color: var(--screen-fg); border-color: var(--screen-sub); }
.expr {
  font: 400 0.95rem var(--font-num); color: var(--screen-sub);
  text-align: right; min-height: 1.4em; overflow-x: auto; white-space: nowrap; scrollbar-width: none;
}
.expr::-webkit-scrollbar { display: none; }
.main {
  font: 500 2.9rem/1.1 var(--font-num); color: var(--screen-fg);
  text-align: right; white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums;
}
.main.error { font-size: 1.15rem; line-height: 1.4; color: var(--op-active); white-space: normal; }

.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.keys button {
  appearance: none; border: 0; cursor: pointer;
  font: 600 1.35rem var(--font-ui);
  height: 62px; border-radius: 14px;
  background: var(--key); color: var(--key-fg);
  box-shadow: 0 2px 0 rgba(0,0,0,.22);
  transition: transform .06s ease, filter .12s ease;
  -webkit-tap-highlight-color: transparent;
}
.keys button:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(0,0,0,0); filter: brightness(.94); }
.keys .fn { background: var(--key-fn); color: var(--key-fn-fg); }
.keys .op { background: var(--op); color: var(--op-fg); font-size: 1.6rem; }
.keys .eq { background: var(--op); color: var(--op-fg); font-size: 1.7rem; font-weight: 800; }
.keys .mem { height: 34px; border-radius: 10px; background: var(--key-mem); color: var(--key-mem-fg); font-size: .8rem; letter-spacing: .06em; box-shadow: none; border: 1px solid var(--panel-line); }
button:focus-visible, .tool:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.history {
  position: absolute; inset: 14px; z-index: 2;
  background: var(--panel); border-radius: 14px; padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.history[hidden] { display: none; }
.history-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--screen-fg); }
.history-head h2 { margin: 0; font-size: .8rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.history ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.history li button {
  width: 100%; text-align: right; background: transparent; border: 0; border-bottom: 1px solid var(--panel-line);
  padding: 8px 2px; cursor: pointer; color: var(--screen-fg); font-family: var(--font-num);
}
.history li small { display: block; color: var(--screen-sub); font-size: .8rem; }
.history li span { font-size: 1.25rem; }
.history .empty { color: var(--screen-sub); font-size: .9rem; line-height: 1.5; padding: 8px 2px; }

/* Financiera */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  appearance: none; border: 1px solid var(--panel-line); background: transparent; color: var(--key-mem-fg);
  font: 700 .74rem var(--font-ui); letter-spacing: .06em; text-transform: uppercase;
  padding: 8px 12px; border-radius: 999px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--op); border-color: var(--op); color: var(--op-fg); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form[hidden], .field[hidden], .extra[hidden], .chips[hidden] { display: none; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > span.lbl { font: 700 .66rem var(--font-ui); letter-spacing: .09em; text-transform: uppercase; color: var(--key-mem-fg); }
.inp { position: relative; }
.inp input, .field select {
  width: 100%; height: 44px; border: 0; border-radius: 10px;
  background: var(--key); color: var(--key-fg);
  font: 500 1rem var(--font-num); padding: 0 12px;
}
.field select { font-family: var(--font-ui); font-weight: 600; font-size: .92rem; }
.inp input { padding-right: 34px; text-align: right; }
.inp .unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 600 .85rem var(--font-ui); color: var(--muted); pointer-events: none; }
.results { background: var(--screen); border-radius: 14px; padding: 4px 16px; margin: 0; }
.results .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--panel-line); }
.results .row:last-child { border-bottom: 0; }
.results dt { color: var(--screen-sub); font-size: .84rem; }
.results dd { margin: 0; color: var(--screen-fg); font: 500 .95rem var(--font-num); text-align: right; font-variant-numeric: tabular-nums; }
.results .none { color: var(--screen-sub); font-size: .88rem; padding: 12px 0; }
.extra { display: flex; flex-direction: column; gap: 10px; }
.extra h3 { margin: 4px 0 0; font: 700 .72rem var(--font-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--key-mem-fg); }
.status { font-size: .78rem; line-height: 1.5; color: var(--screen-sub); }
.status a { color: var(--op-active); }
.note { font-size: .76rem; line-height: 1.5; color: var(--key-mem-fg); margin: 0; }
.reset { align-self: flex-start; }
.add { align-self: stretch; padding: 10px; text-align: center; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--op); color: var(--op-fg); font-weight: 700; font-size: .85rem;
  padding: 8px 16px; border-radius: 999px; z-index: 20;
}
.toast[hidden] { display: none; }
.hint { max-width: 380px; font-size: .78rem; line-height: 1.5; color: var(--muted); text-align: center; margin: 0; }
.hint[hidden] { display: none; }

@media (max-width: 380px) {
  .keys button { height: 56px; font-size: 1.25rem; }
  .main { font-size: 2.5rem; }
}
@media (prefers-reduced-motion: reduce) { .keys button { transition: none; } }
</style>

<header class="brand">
  <h1 class="wordmark">Calcu<span>VA</span><b>K</b></h1>
  <span class="byline">Una calculadora de GOVAK</span>
</header>

<div class="bar" id="bar" aria-label="Indicadores del día"></div>

<main class="calc" id="calc">
  <div class="tabs" role="tablist" aria-label="Tipo de calculadora">
    <button class="tab" id="tabStd" role="tab" aria-selected="true" aria-controls="viewStd" type="button">Estándar</button>
    <button class="tab" id="tabFin" role="tab" aria-selected="false" aria-controls="viewFin" type="button">Financiera</button>
    <button class="tab" id="tabCom" role="tab" aria-selected="false" aria-controls="viewFin" type="button">Comercial</button>
    <button class="tab" id="tabUni" role="tab" aria-selected="false" aria-controls="viewFin" type="button">Unidades</button>
    <button class="tab" id="tabCon" role="tab" aria-selected="false" aria-controls="viewFin" type="button">Construcción</button>
    <button class="tab" id="tabPre" role="tab" aria-selected="false" aria-controls="viewFin" type="button">Prevención</button>
  </div>

  <!-- ESTÁNDAR -->
  <div class="view" id="viewStd" role="tabpanel" aria-labelledby="tabStd">
    <section class="screen" aria-label="Pantalla">
      <div class="screen-top">
        <span class="mem-flag" id="memFlag" aria-live="polite"></span>
        <div class="tools">
          <button class="tool" id="btnCopy" type="button">Copiar</button>
          <button class="tool" id="btnHistory" type="button" aria-expanded="false" aria-controls="history">Historial</button>
        </div>
      </div>
      <div class="expr" id="expr" aria-live="off"></div>
      <div class="main" id="main" role="status" aria-live="polite">0</div>
    </section>

    <div class="keys" id="keys">
      <button class="mem" data-key="MC" aria-label="Borrar memoria">MC</button>
      <button class="mem" data-key="MR" aria-label="Recuperar memoria">MR</button>
      <button class="mem" data-key="M-" aria-label="Restar de la memoria">M−</button>
      <button class="mem" data-key="M+" aria-label="Sumar a la memoria">M+</button>

      <button class="fn" data-key="C" aria-label="Borrar todo">AC</button>
      <button class="fn" data-key="B" aria-label="Borrar último dígito">⌫</button>
      <button class="fn" data-key="%" aria-label="Porcentaje">%</button>
      <button class="op" data-key="/" aria-label="Dividir">÷</button>

      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button class="op" data-key="*" aria-label="Multiplicar">×</button>

      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
      <button class="op" data-key="-" aria-label="Restar">−</button>

      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button class="op" data-key="+" aria-label="Sumar">+</button>

      <button class="fn" data-key="N" aria-label="Cambiar signo">±</button>
      <button data-key="0">0</button>
      <button data-key="." aria-label="Coma decimal">,</button>
      <button class="eq" data-key="=" aria-label="Igual">=</button>
    </div>

    <aside class="history" id="history" hidden aria-label="Historial de cálculos">
      <div class="history-head">
        <h2>Historial</h2>
        <div class="tools">
          <button class="tool" id="btnClearHistory" type="button">Vaciar</button>
          <button class="tool" id="btnCloseHistory" type="button">Cerrar</button>
        </div>
      </div>
      <ul id="historyList"></ul>
    </aside>
  </div>

  <!-- FINANCIERA -->
  <div class="view" id="viewFin" role="tabpanel" aria-labelledby="tabFin" hidden>
    <section class="screen" aria-label="Resultado financiero">
      <div class="screen-top">
        <span class="mem-flag" id="finTitle"></span>
        <div class="tools"><button class="tool" id="btnFinCopy" type="button">Copiar</button></div>
      </div>
      <div class="expr" id="finLabel">&nbsp;</div>
      <div class="main" id="finMain" role="status" aria-live="polite">—</div>
    </section>
    <div class="chips" id="chips" role="group" aria-label="Herramienta financiera"></div>
    <div class="form" id="finForm"></div>
    <dl class="results" id="finResults"></dl>
    <p class="note" id="finNote"></p>
    <div class="extra" id="finExtra" hidden></div>
  </div>
</main>

<p class="hint" id="hint">Funciona también con el teclado: números, + − * /, Enter para igual, Retroceso para borrar y Esc para limpiar.</p>
<div class="toast" id="toast" hidden></div>

<script>
/*ENGINE*/
function fmt(str) {
  if (/e/i.test(str)) return str.replace('.', ',');
  var neg = str[0] === '-';
  if (neg) str = str.slice(1);
  var parts = str.split('.');
  var int = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  var out = int + (parts.length > 1 ? ',' + parts[1] : '');
  return (neg ? '-' : '') + out;
}
function clean(r) {
  if (!isFinite(r)) throw new Error('Resultado no válido');
  return Number(r.toPrecision(12));
}
function evaluate(t) {
  var a = [t[0]], i, op, n, prev;
  for (i = 1; i < t.length; i += 2) {
    op = t[i]; n = t[i + 1];
    if (op === '×' || op === '÷') {
      prev = a.pop();
      if (op === '÷' && n === 0) throw new Error('No se puede dividir por 0');
      a.push(op === '×' ? prev * n : prev / n);
    } else { a.push(op, n); }
  }
  var r = a[0];
  for (i = 1; i < a.length; i += 2) r = a[i] === '+' ? r + a[i + 1] : r - a[i + 1];
  return clean(r);
}
function createCalc(initialHistory) {
  var tokens = [], entry = '0', awaiting = false, replace = false, done = false;
  var error = null, lastExpr = '', mem = 0, hasMem = false;
  var history = Array.isArray(initialHistory) ? initialHistory.slice(0, 30) : [];
  var OPS = { '+': '+', '-': '−', '*': '×', '/': '÷' };

  function reset() { tokens = []; entry = '0'; awaiting = false; replace = false; done = false; lastExpr = ''; }
  function startFresh() { if (done) { tokens = []; done = false; lastExpr = ''; entry = '0'; replace = false; } }
  function exprText(list) {
    return list.map(function (x) { return typeof x === 'number' ? fmt(String(x)) : x; }).join(' ');
  }
  function fail(msg) { reset(); error = msg; }

  function press(k) {
    if (error) { error = null; reset(); if (k === 'C') return; }
    try {
      if (/^[0-9]$/.test(k)) {
        startFresh();
        if (awaiting || replace || entry === '0') { entry = k; awaiting = false; replace = false; }
        else if (entry === '-0') { entry = '-' + k; }
        else if (entry.replace(/[-.]/g, '').length < 15) { entry += k; }
      } else if (k === '.') {
        startFresh();
        if (awaiting || replace) { entry = '0.'; awaiting = false; replace = false; }
        else if (entry.indexOf('.') < 0) { entry += '.'; }
      } else if (OPS[k]) {
        var op = OPS[k];
        if (done) { tokens = [Number(entry)]; done = false; lastExpr = ''; tokens.push(op); awaiting = true; replace = false; }
        else if (awaiting) { tokens[tokens.length - 1] = op; }
        else { tokens.push(Number(entry), op); awaiting = true; replace = false; }
      } else if (k === '=') {
        if (done) return;
        var list = tokens.concat([Number(entry)]);
        if (list.length === 1) { lastExpr = fmt(entry) + ' ='; done = true; tokens = []; awaiting = false; return; }
        var res = evaluate(list);
        var text = exprText(list);
        history.unshift({ expr: text, result: String(res) });
        if (history.length > 30) history.length = 30;
        lastExpr = text + ' =';
        entry = String(res); tokens = []; awaiting = false; replace = false; done = true;
      } else if (k === 'C') {
        reset();
      } else if (k === 'B') {
        if (done || awaiting || replace) return;
        entry = entry.slice(0, -1);
        if (entry === '' || entry === '-') entry = '0';
      } else if (k === 'N') {
        if (done) { tokens = []; lastExpr = ''; done = false; }
        awaiting = false;
        if (entry === '0' && !replace) { entry = '-0'; }
        else if (entry === '-0') { entry = '0'; }
        else entry = entry[0] === '-' ? entry.slice(1) : '-' + entry;
      } else if (k === '%') {
        var cur = Number(entry), val;
        if (tokens.length >= 2 && typeof tokens[tokens.length - 1] === 'string') {
          var base = evaluate(tokens.slice(0, -1));
          var o = tokens[tokens.length - 1];
          val = (o === '+' || o === '−') ? base * cur / 100 : cur / 100;
        } else { val = cur / 100; }
        if (done) { tokens = []; lastExpr = ''; done = false; }
        entry = String(clean(val)); awaiting = false; replace = false;
      } else if (k === 'MC') { mem = 0; hasMem = false; }
      else if (k === 'MR') {
        if (!hasMem) return;
        if (done) { tokens = []; done = false; lastExpr = ''; }
        entry = String(mem); awaiting = false; replace = true;
      } else if (k === 'M+' || k === 'M-') {
        var v = Number(entry);
        mem = clean(k === 'M+' ? mem + v : mem - v); hasMem = true; replace = true;
      }
    } catch (e) { fail(e.message); }
  }
  function view() {
    return {
      main: error ? error : fmt(entry),
      raw: entry,
      expr: error ? '' : (done ? lastExpr : exprText(tokens)),
      error: !!error,
      hasMem: hasMem,
      history: history
    };
  }
  function clearHistory() { history = []; }
  function useResult(res) { reset(); entry = res; done = false; replace = true; error = null; }
  return { press: press, view: view, clearHistory: clearHistory, useResult: useResult };
}
/*END*/

/*FIN*/
function parseNum(s) {
  if (s == null) return NaN;
  s = String(s).trim().replace(/[\s$%]/g, '');
  if (s === '') return NaN;
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  var n = Number(s);
  return isFinite(n) ? n : NaN;
}
function fmtN(n, dec) {
  dec = dec == null ? 0 : dec;
  var s = Math.abs(n).toFixed(dec), p = s.split('.');
  var out = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (p[1] ? ',' + p[1] : '');
  return (n < 0 && Number(s) !== 0 ? '-' : '') + out;
}
function peso(n) { return '$ ' + fmtN(Math.round(n), 0); }
function pct(n, d) { return fmtN(n, d == null ? 2 : d) + ' %'; }

  }
  $('tabStd').addEventListener('click', function () { setTab('std'); });
  $('tabFin').addEventListener('click', function () { setTab('fin'); });
  $('tabCom').addEventListener('click', function () { setTab('com'); });
  $('tabUni').addEventListener('click', function () { setTab('uni'); });
  $('tabCon').addEventListener('click', function () { setTab('con'); });
  $('tabPre').addEventListener('click', function () { setTab('pre'); });

  /* ---------- Financiera ---------- */
  var activeBy = { fin: 'iva', com: 'precio', uni: 'long', con: 'horm', pre: 'tasas' }, state = {}, lastRaw = '', manual = {}, indStatus = 'ref';
  try { manual = JSON.parse(localStorage.getItem(STORE_IND) || '{}') || {}; } catch (e) { manual = {}; }
  Object.keys(manual).forEach(function (k) { if (k in ind && typeof manual[k] === 'number') ind[k] = manual[k]; });

  function toolById(id) { return TOOLS.filter(function (t) { return t.id === id; })[0]; }
  function fieldEl(tool, f) { return $('f_' + tool.id + '_' + f.id); }

  function renderBar() {
    var bar = $('bar'); bar.textContent = '';
    [['usd', 'Dólar'], ['uf', 'UF'], ['utm', 'UTM'], ['eur', 'Euro']].forEach(function (it) {
      var d = document.createElement('div'), b = document.createElement('b'), sp = document.createElement('span');
      b.textContent = it[1]; sp.textContent = ind[it[0]] > 0 ? '$ ' + fmtN(ind[it[0]], ind[it[0]] % 1 === 0 ? 0 : 2) : '—';
      d.appendChild(b); d.appendChild(sp); bar.appendChild(d);
    });
    var sm = document.createElement('small');
    sm.textContent = indStatus === 'live' ? 'En vivo desde mindicador.cl' : 'Valores de referencia al 24 oct 2026 (UTM de octubre)';
    bar.appendChild(sm);
  }
  function renderChips() {
    var box = $('chips'); box.textContent = ''; box.hidden = GROUPS[tab].length < 2;
    GROUPS[tab].forEach(function (t) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = t.name;
      b.setAttribute('aria-pressed', String(t.id === activeBy[tab]));
      b.addEventListener('click', function () { activeBy[tab] = t.id; buildTool(); });
      box.appendChild(b);
    });
  }
  function buildTool() {
    var tool = toolById(activeBy[tab]);
    renderChips();
    $('finTitle').textContent = tool.title;
    var form = $('finForm'); form.textContent = '';
    var st = state[tool.id] || (state[tool.id] = {});
    tool.fields.forEach(function (f) {
      var wrap = document.createElement('div'); wrap.className = 'field' + (f.wide ? ' wide' : ''); wrap.id = 'w_' + tool.id + '_' + f.id;
      var lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.id = 'l_' + tool.id + '_' + f.id;
      lbl.textContent = typeof f.label === 'function' ? f.label({}) : f.label;
      var ctl;
      if (f.kind === 'sel') {
        ctl = document.createElement('select');
        f.opts.forEach(function (o) { var op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; ctl.appendChild(op); });
      } else {
        ctl = document.createElement('input'); ctl.type = 'text'; ctl.inputMode = 'decimal'; ctl.autocomplete = 'off';
      }
      ctl.id = 'f_' + tool.id + '_' + f.id;
      ctl.value = st[f.id] != null ? st[f.id] : (typeof f.def === 'function' ? f.def() : f.def);
      ctl.setAttribute('aria-label', typeof f.label === 'function' ? f.label({}) : f.label);
      ctl.addEventListener('input', recompute);
      ctl.addEventListener('change', recompute);
      wrap.appendChild(lbl);
      if (f.kind === 'num') {
        var box = document.createElement('div'); box.className = 'inp'; box.appendChild(ctl);
        if (f.unit) { var u = document.createElement('span'); u.className = 'unit'; u.textContent = f.unit; box.appendChild(u); }
        wrap.appendChild(box);
      } else wrap.appendChild(ctl);
      form.appendChild(wrap);
    });
    $('finNote').textContent = typeof tool.note === 'function' ? '' : (tool.note || '');
    $('chips').style.order = 1; form.style.order = 2; $('finResults').style.order = 4; $('finNote').style.order = 5;
    $('finExtra').style.order = tool.extra === 'swap' ? 3 : 6;
    buildExtra(tool);
    recompute();
  }
  function readValues(tool) {
    var v = {}, st = state[tool.id];
    tool.fields.forEach(function (f) {
      var el = fieldEl(tool, f);
      st[f.id] = el.value;
      v[f.id] = f.kind === 'num' ? parseNum(el.value) : el.value;
    });
    return v;
  }
  function recompute() {
    var tool = toolById(activeBy[tab]), v = readValues(tool);
    tool.fields.forEach(function (f) {
      var w = $('w_' + tool.id + '_' + f.id);
      if (f.when) { var show = Object.keys(f.when).every(function (k) { var w = f.when[k]; return Array.isArray(w) ? w.indexOf(v[k]) >= 0 : v[k] === w; }); w.hidden = !show; }
      if (typeof f.label === 'function') { var t = f.label(v); $('l_' + tool.id + '_' + f.id).textContent = t; fieldEl(tool, f).setAttribute('aria-label', t); }
    });
    $('finNote').textContent = typeof tool.note === 'function' ? tool.note(v) : (tool.note || '');
    var r = tool.run(v), main = $('finMain'), res = $('finResults');
    res.textContent = '';
    if (r.error) {
      main.textContent = r.error; main.classList.add('error'); main.style.fontSize = '';
      $('finLabel').textContent = ' '; lastRaw = '';
    } else if (r.empty) {
      main.textContent = '—'; main.classList.remove('error'); main.style.fontSize = '';
      $('finLabel').textContent = 'Completa los datos'; lastRaw = '';
      var none = document.createElement('div'); none.className = 'none'; none.textContent = 'Ingresa los valores para ver el detalle.'; res.appendChild(none);
    } else {
      main.textContent = r.main; main.classList.remove('error'); fitFont(main, r.main.length, false);
      $('finLabel').textContent = r.label; lastRaw = r.raw || '';
      r.rows.forEach(function (row) {
        var d = document.createElement('div'); d.className = 'row';
        var dt = document.createElement('dt'); dt.textContent = row[0];
        var dd = document.createElement('dd'); dd.textContent = row[1];
        d.appendChild(dt); d.appendChild(dd); res.appendChild(d);
      });
    }
  }
  $('btnFinCopy').addEventListener('click', function () {
    if (!lastRaw) return;
    var text = lastRaw.replace('.', ',');
    copyText(text, 'Copiado: ' + text, $('finMain'));
  });

  /* Indicadores editables */
  function indText(k) {
    var v = ind[k]; if (v == null) return '';
    return fmtN(v, v % 1 === 0 ? 0 : IND_DEFAULT[k].dec);
  }
  function statusHtml() {
    var s = $('finStatus'); if (!s) return;
    s.textContent = '';
    if (indStatus === 'live') s.appendChild(document.createTextNode('Valores en vivo desde mindicador.cl. Puedes corregirlos a mano. '));
    else s.appendChild(document.createTextNode('Valores de referencia al 24-oct-2026. Sol, pesos argentino y colombiano, real y yuan son aproximados, tomados de las cotizaciones de BuscaEPP. Edítalos cuando cambien. Revisa el valor oficial en '));
    var a1 = document.createElement('a'); a1.href = 'https://www.sii.cl/valores_y_fechas/uf/uf2026.htm'; a1.target = '_blank'; a1.rel = 'noopener'; a1.textContent = 'SII';
    var a2 = document.createElement('a'); a2.href = 'https://www.bcentral.cl/en/inicio/-/details/content-exchange-rates-and-parities'; a2.target = '_blank'; a2.rel = 'noopener'; a2.textContent = 'Banco Central';
    s.appendChild(a1); s.appendChild(document.createTextNode(' y ')); s.appendChild(a2); s.appendChild(document.createTextNode('.'));
  }
  function buildSwap(ex, tool) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'tool add'; b.textContent = '⇄ Invertir unidades';
    b.addEventListener('click', function () {
      var a = fieldEl(tool, { id: 'de' }), c = fieldEl(tool, { id: 'a' }), t = a.value;
      a.value = c.value; c.value = t; recompute();
    });
    ex.appendChild(b);
  }
  function buildExtra(tool) {
    var ex = $('finExtra'); ex.textContent = '';
    ex.hidden = !tool.extra;
    if (!tool.extra) return;
    if (tool.extra === 'swap') { buildSwap(ex, tool); return; }
    var h = document.createElement('h3'); h.textContent = 'Valor de cada indicador en pesos'; ex.appendChild(h);
    var grid = document.createElement('div'); grid.className = 'form';
    Object.keys(IND_DEFAULT).forEach(function (k) {
      var wrap = document.createElement('div'); wrap.className = 'field';
      var lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = IND_DEFAULT[k].name + ' · ' + IND_DEFAULT[k].when;
      var box = document.createElement('div'); box.className = 'inp';
      var inp = document.createElement('input'); inp.type = 'text'; inp.inputMode = 'decimal'; inp.id = 'ind_' + k; inp.value = indText(k); inp.autocomplete = 'off';
      inp.setAttribute('aria-label', 'Valor de ' + IND_DEFAULT[k].name + ' en pesos');
      inp.addEventListener('input', function () {
        var n = parseNum(inp.value);
        if (n > 0) { ind[k] = n; manual[k] = n; } else { ind[k] = null; delete manual[k]; }
        try { localStorage.setItem(STORE_IND, JSON.stringify(manual)); } catch (e) {}
        renderBar(); recompute();
      });
      var u = document.createElement('span'); u.className = 'unit'; u.textContent = '$';
      box.appendChild(inp); box.appendChild(u); wrap.appendChild(lbl); wrap.appendChild(box); grid.appendChild(wrap);
    });
    ex.appendChild(grid);
    var st = document.createElement('p'); st.className = 'status'; st.id = 'finStatus'; ex.appendChild(st);
    var rs = document.createElement('button'); rs.type = 'button'; rs.className = 'tool reset'; rs.textContent = 'Restablecer valores';
    rs.addEventListener('click', function () {
      manual = {}; try { localStorage.removeItem(STORE_IND); } catch (e) {}
      resetInd(); applyLive(); renderBar(); buildTool();
    });
    ex.appendChild(rs);
    statusHtml();
  }

  /* Valores en vivo: funciona cuando la página corre en un sitio que permite la consulta (por ejemplo buscaepp.cl). */
  var live = null;
  function applyLive() {
    if (!live) return;
    var map = { uf: 'uf', utm: 'utm', usd: 'dolar', eur: 'euro' };
    Object.keys(map).forEach(function (k) {
      var item = live[map[k]];
      if (item && item.valor > 0 && !(k in manual)) ind[k] = item.valor;
    });
    indStatus = 'live';
  }
  try {
    var ctl = new AbortController(); var to = setTimeout(function () { ctl.abort(); }, 4000);
    fetch('https://mindicador.cl/api', { signal: ctl.signal }).then(function (r) { return r.json(); }).then(function (d) {
      clearTimeout(to); live = d; applyLive(); renderBar(); if (tab !== 'std') buildTool();
    }).catch(function () {});
  } catch (e) {}

  renderBar();
  render();
})();
</script>
